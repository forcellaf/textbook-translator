[project]
name = "translation-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "forcellaf", email = "afn487@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0,<2.0.0",
    "httpx>=0.27",
    "openai>=1.0.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

# `magic-pdf[full]` was removed along with the local parser: it is the source
# of the historical parse defects, and it dragged in torch, paddle and
# pycocotools for a code path nothing calls any more. `pymupdf` and `httpx`
# were previously transitive dependencies of it and of `openai`; they are
# declared explicitly now because `src.splitter` and `src.mineru_api` import
# them directly.
#
# pandoc is the one dependency this project does NOT install through Python.
# Install it separately: https://pandoc.org/installing.html

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
