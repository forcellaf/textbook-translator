[project]
name = "translation-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "forcellaf", email = "afn487@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

# `magic-pdf[full]` was removed along with the local parser: it is the source
# of the historical parse defects, and it dragged in torch, paddle and
# pycocotools for a code path nothing calls any more. `pymupdf` and `httpx`
# are declared explicitly because `src.splitter` and `src.mineru_api` import
# them directly.
#
# `anthropic` is the only LLM SDK. It runs on `httpx2` (the maintained fork of
# `httpx`, published by Pydantic), not `httpx`: MinerU traffic stays on
# `httpx`, Claude traffic is on `httpx2`, and the provider tests fake the
# latter with `httpx2.MockTransport` -- hence `httpx2` in the dev group.
#
# A LaTeX distribution (TeX Live or MiKTeX, providing `pdflatex`) is the one
# dependency this project does NOT install through Python. The build shells
# out to it; see src/build.py.

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
agent = [
    "claude-agent-sdk>=0.2.165",
]
dev = [
    "httpx2>=2.0",
    "pytest>=9.1.1",
]
